apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vestfoldfylke-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-isy-graving-gateway_vestfoldfylke_no
      fintlabs.no/org-id: vestfoldfylke.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "vestfoldfylke-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "vestfoldfylke.no"
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/beta/vestfoldfylke-no/api/isygraving/instances"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/beta/vestfoldfylke-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/beta/vestfoldfylke-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/beta/vestfoldfylke-no/actuator/health/liveness"
      - op: add
        path: "/spec/env/-"
        value:
          name: novari.kafka.topic.org-id
          value: "vestfoldfylke-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.telemetry.org-id"
          value: "vestfoldfylke.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: server.servlet.context-path
          value: "/beta/vestfoldfylke-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "OTEL_EXPORTER_OTLP_ENDPOINT"
          value: "http://alloy.flais-system.svc.cluster.local:4318"
    target:
      kind: Application
      name: fint-flyt-isy-graving-gateway
  - patch: |-
      - op: add
        path: "/spec/env/-"
        value:
          name: logging.level.no.novari.flyt.isygraving.gateway.dispatch
          value: "DEBUG"
    target:
      kind: Application
      name: fint-flyt-isy-graving-gateway
  - patch: |-
      - op: replace
        path: "/spec/itemPath"
        value: "vaults/aks-beta-vault/items/novari-fint-flyt-isy-graving-gateway-out-vestfoldfylke-no"
    target:
      kind: OnePasswordItem
      name: novari-flyt-isy-graving-dispatch-oauth2-client
