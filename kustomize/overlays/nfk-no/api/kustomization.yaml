apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nfk-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-isy-graving-gateway_nfk_no
      fintlabs.no/org-id: nfk.no

patches:
  - patch: |-
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "nfk-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "nfk.no"
      - op: replace
        path: "/spec/ingress/basePath"
        value: "/nfk-no/api/isygraving/instances"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/nfk-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/nfk-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/nfk-no/actuator/health/liveness"
      - op: add
        path: "/spec/env/-"
        value:
          name: novari.kafka.topic.org-id
          value: "nfk-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.telemetry.org-id"
          value: "nfk.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: server.servlet.context-path
          value: "/nfk-no"
    target:
      kind: Application
      name: fint-flyt-isy-graving-gateway
  - patch: |-
      - op: replace
        path: "/spec/itemPath"
        value: "vaults/aks-api-vault/items/novari-fint-flyt-isy-graving-gateway-out-nfk-no"
    target:
      kind: OnePasswordItem
      name: novari-flyt-isy-graving-dispatch-oauth2-client
